name: Keep-alive Render

on:
  schedule:
    - cron: '*/14 * * * *'   # Render free duerme tras ~15 min sin tráfico
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping al healthcheck
        run: curl -fsS --retry 3 --retry-delay 10 -m 60 https://flota-predictiva.onrender.com/salud
