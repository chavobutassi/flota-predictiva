<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titulo %}Flota{% endblock %} · Flota predictiva</title>
<link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
<header class="barra"><div class="interior">
  <a class="marca" href="/">Flota predictiva</a>
  {% if usuario %}
  <span class="espacio"></span>
  <span class="suave">{{ usuario.nombre }} {{ usuario.apellido }}</span>
  <a href="/clave">Contraseña</a>
  <form method="post" action="/salir">
    <input type="hidden" name="csrf" value="{{ usuario.csrf }}">
    <button class="sec" type="submit">Salir</button>
  </form>
  {% endif %}
</div></header>
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
